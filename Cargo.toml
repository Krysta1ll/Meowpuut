[workspace]
resolver = "2"
members = [
    "crates/meowpuut-core",
    "crates/meowpuut-lexicon",
    "crates/meowpuut-client",
    "crates/meowpuut-ffi",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.test]
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "fat"
codegen-units = 1
