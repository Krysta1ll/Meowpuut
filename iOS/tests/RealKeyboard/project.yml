# Development only: a host app and a UI test that show the keyboard as a real
# system keyboard on a simulator and take pictures (scripts/ios-real-keyboard-shots.sh).
# Generated into the build folder; not part of the shipped schemes.
name: RealKeyboard
options:
  bundleIdPrefix: local.meowpuut.realkeyboard
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
targets:
  RealKeyboardHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.meowpuut.realkeyboard.host
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  RealKeyboardShots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RealKeyboardHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.meowpuut.realkeyboard.shots
        TEST_TARGET_NAME: RealKeyboardHost
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  RealKeyboard:
    build:
      targets:
        RealKeyboardHost: all
        RealKeyboardShots: [test]
    test:
      targets:
        - RealKeyboardShots
