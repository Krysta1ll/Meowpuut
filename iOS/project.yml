name: Meowpuut
options:
  bundleIdPrefix: app.meowpuut
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Meowpuut:
    type: application
    platform: iOS
    sources:
      - App
      - SharedKeyboardSettings.swift
      - InterfaceText.swift
      - ../Sources/Brand.swift
      - ../assets/brand/MeowpuutMark.png
      - Generated/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meowpuut.ios
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 喵撲
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: MeowpuutKeyboard
        embed: true
  MeowpuutKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - SharedKeyboardSettings.swift
      - InterfaceText.swift
      - ../Sources/Engine.swift
      - ../Sources/EngineKeyHandler.swift
      - ../Sources/InputBackend.swift
      - ../Sources/ChineseWithJapaneseBackend.swift
      - ../Sources/JapaneseBackend.swift
      - ../crates/meowpuut-ffi/include/meowpuut.h
      - ../Sources/ChoiceMemory.swift
      - ../Sources/Brand.swift
      - ../Sources/CandidatePalette.swift
      - ../Sources/Bridge.h
      - path: Generated/Licenses
        type: folder
        buildPhase: resources
      - path: Generated/mimo_base.bin
        buildPhase: resources
      - path: Generated/native-zhuyin.tsv
        buildPhase: resources
      - path: Generated/native-pinyin.tsv
        buildPhase: resources
      - path: Generated/native-japanese.json
        buildPhase: resources
      - path: Generated/mimo-manifest.json
        buildPhase: resources
      - path: Generated/associations.json
        buildPhase: resources
      - path: Generated/language-evidence.sqlite
        buildPhase: resources
      - path: ../Modules
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: app.meowpuut.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Bridge.h
        # Rust engine (crates/meowpuut-ffi), built by the pre-build script below.
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/../.build/rust/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-lmeowpuut_ffi", "-lsqlite3"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust engine
        script: bash "$PROJECT_DIR/../scripts/build-rust.sh" xcode
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/../.build/rust/$(PLATFORM_NAME)/libmeowpuut_ffi.a

schemes:
  Meowpuut:
    build:
      targets:
        Meowpuut: all
