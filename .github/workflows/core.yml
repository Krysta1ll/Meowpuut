name: Portable core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - run: cargo test -p meowpuut-core --doc
      - run: cargo test -p meowpuut-lexicon --doc
      - run: cargo test -p meowpuut-client --doc
